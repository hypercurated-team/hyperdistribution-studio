# Builds an iOS app on a GitHub macOS runner with `eas build --local`
# (free: doesn't use Expo's monthly cloud builds) and, if asked, uploads it
# to App Store Connect. Signing comes from the credentials already in EAS.
#
# Needs one repository secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
name: iOS build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [hypermixer, hyperjudge]
        default: hypermixer
      submit:
        description: Upload to App Store Connect when the build finishes
        type: boolean
        default: true

concurrency:
  group: ios-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ inputs.app == 'hypermixer' && 'mobile' || 'hyperjudge' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Build (local, on this runner)
        run: npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/app.ipa"

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-ipa
          path: ${{ runner.temp }}/app.ipa
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        run: npx --yes eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive --wait
